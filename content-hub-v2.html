<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Hub · Patrícia Leal</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --teal-dark: #0d3d3a;
    --teal-mid: #1aaa96;
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --cream: #f5efe4;
    --cream-dim: #e8dfd0;
    --muted: #7a6e60;
    --red: #c0392b;
    --insta: #e1306c;
    --linkedin: #0077b5;
    --google: #4285f4;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Cormorant Garamond',Georgia,serif; background:var(--teal-dark); color:var(--cream); min-height:100vh; overflow-x:hidden; }

  /* HEADER */
  header { display:flex; align-items:center; justify-content:space-between; padding:18px 28px; border-bottom:1px solid rgba(201,168,76,0.2); background:rgba(13,61,58,0.97); position:sticky; top:0; z-index:100; backdrop-filter:blur(8px); gap:12px; flex-wrap:wrap; }
  .logo { font-family:'Dancing Script',cursive; font-size:1.6rem; color:var(--gold); line-height:1; }
  .logo span { font-family:'Cormorant Garamond',serif; font-size:0.78rem; color:var(--cream-dim); display:block; margin-top:2px; letter-spacing:0.12em; font-style:italic; }
  .header-actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

  /* NAV TABS */
  .nav-tabs { display:flex; gap:4px; background:rgba(0,0,0,0.2); border-radius:6px; padding:3px; }
  .nav-tab { font-family:'DM Mono',monospace; font-size:0.7rem; letter-spacing:0.1em; text-transform:uppercase; padding:6px 16px; border-radius:4px; border:none; cursor:pointer; background:transparent; color:var(--muted); transition:all 0.15s; }
  .nav-tab.active { background:var(--gold); color:var(--teal-dark); font-weight:600; }

  /* BTNS */
  .btn { font-family:'Cormorant Garamond',serif; font-size:0.88rem; letter-spacing:0.06em; padding:7px 16px; border-radius:4px; border:none; cursor:pointer; transition:all 0.18s; }
  .btn-gold { background:var(--gold); color:var(--teal-dark); font-weight:600; }
  .btn-gold:hover { background:var(--gold-light); transform:translateY(-1px); }
  .btn-outline { background:transparent; color:var(--gold); border:1px solid rgba(201,168,76,0.45); }
  .btn-outline:hover { border-color:var(--gold); background:rgba(201,168,76,0.07); }

  /* LAYOUT */
  .layout { display:grid; grid-template-columns:210px 1fr; min-height:calc(100vh - 62px); }

  /* SIDEBAR */
  .sidebar { border-right:1px solid rgba(201,168,76,0.12); padding:18px 0; background:rgba(8,24,22,0.5); overflow-y:auto; max-height:calc(100vh - 62px); position:sticky; top:62px; }
  .sidebar-title { font-family:'DM Mono',monospace; font-size:0.62rem; letter-spacing:0.18em; color:var(--gold); text-transform:uppercase; padding:0 16px 10px; opacity:0.75; }
  .day-item { padding:9px 16px; cursor:pointer; border-left:3px solid transparent; transition:all 0.15s; display:flex; flex-direction:column; gap:2px; }
  .day-item:hover { background:rgba(201,168,76,0.07); border-left-color:rgba(201,168,76,0.35); }
  .day-item.active { background:rgba(201,168,76,0.11); border-left-color:var(--gold); }
  .day-label { font-family:'DM Mono',monospace; font-size:0.7rem; color:var(--gold); }
  .day-date { font-size:0.8rem; color:var(--cream-dim); }
  .day-count { font-size:0.67rem; color:var(--muted); font-family:'DM Mono',monospace; }
  .day-count.has { color:var(--teal-mid); }

  /* MAIN */
  .content { padding:26px 30px; overflow-y:auto; }
  .empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:58vh; gap:14px; opacity:0.55; }
  .empty-icon { font-size:2.8rem; }
  .empty-state p { font-style:italic; color:var(--cream-dim); }

  /* DAY HEADER */
  .day-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:22px; padding-bottom:14px; border-bottom:1px solid rgba(201,168,76,0.18); }
  .day-title { font-family:'Dancing Script',cursive; font-size:1.9rem; color:var(--gold); }
  .day-subtitle { font-size:0.78rem; color:var(--muted); font-family:'DM Mono',monospace; margin-top:3px; }

  /* CARDS */
  .cards-grid { display:grid; gap:18px; }
  .pub-card { background:rgba(255,255,255,0.035); border:1px solid rgba(201,168,76,0.14); border-radius:10px; overflow:hidden; transition:border-color 0.18s; }
  .pub-card:hover { border-color:rgba(201,168,76,0.32); }
  .pub-card-header { display:flex; justify-content:space-between; align-items:center; padding:13px 16px; background:rgba(0,0,0,0.18); cursor:pointer; gap:10px; }
  .pub-card-header-left { display:flex; align-items:center; gap:10px; flex:1; min-width:0; }
  .type-badge { font-family:'DM Mono',monospace; font-size:0.62rem; letter-spacing:0.1em; padding:3px 9px; border-radius:20px; text-transform:uppercase; flex-shrink:0; }
  .type-reel { background:rgba(225,48,108,0.14); color:#e1306c; border:1px solid rgba(225,48,108,0.28); }
  .type-post { background:rgba(26,170,150,0.14); color:var(--teal-mid); border:1px solid rgba(26,170,150,0.28); }
  .type-story { background:rgba(201,168,76,0.14); color:var(--gold); border:1px solid rgba(201,168,76,0.28); }
  .pub-title-input { background:transparent; border:none; color:var(--cream); font-family:'Cormorant Garamond',serif; font-size:0.98rem; font-weight:600; flex:1; outline:none; min-width:0; }
  .pub-title-input::placeholder { color:var(--muted); font-style:italic; }
  .card-actions { display:flex; gap:5px; align-items:center; flex-shrink:0; }
  .icon-btn { background:transparent; border:none; cursor:pointer; color:var(--muted); font-size:0.82rem; padding:4px 5px; border-radius:4px; transition:all 0.13s; line-height:1; }
  .icon-btn:hover { color:var(--cream); background:rgba(255,255,255,0.08); }
  .icon-btn.danger:hover { color:var(--red); }
  .pub-card-body { padding:16px; display:grid; gap:14px; }
  .pub-card-body.collapsed { display:none; }

  /* SECTION LABEL */
  .section-label { font-family:'DM Mono',monospace; font-size:0.6rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--gold); margin-bottom:6px; opacity:0.82; display:flex; align-items:center; gap:8px; }
  .section-label::after { content:''; flex:1; height:1px; background:rgba(201,168,76,0.18); }

  /* INPUTS */
  textarea, input[type="text"], input[type="date"], input[type="time"], select {
    background:rgba(0,0,0,0.22); border:1px solid rgba(201,168,76,0.14); border-radius:6px;
    color:var(--cream); font-family:'Cormorant Garamond',serif; font-size:0.93rem;
    padding:9px 11px; width:100%; outline:none; transition:border-color 0.18s; resize:vertical;
  }
  textarea:focus, input:focus, select:focus { border-color:rgba(201,168,76,0.48); }
  textarea::placeholder, input::placeholder { color:var(--muted); font-style:italic; }
  select option { background:var(--teal-dark); }

  /* SCHEDULE */
  .schedule-row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .schedule-time { width:130px; flex-shrink:0; }
  .sched-badge { font-family:'DM Mono',monospace; font-size:0.68rem; padding:5px 12px; border-radius:4px; background:rgba(201,168,76,0.1); border:1px solid rgba(201,168,76,0.28); color:var(--gold); white-space:nowrap; }
  .metricool-btn { display:inline-flex; align-items:center; gap:6px; font-family:'DM Mono',monospace; font-size:0.67rem; letter-spacing:0.07em; padding:7px 14px; border-radius:5px; border:1px solid rgba(26,170,150,0.38); background:rgba(26,170,150,0.07); color:var(--teal-mid); cursor:pointer; text-decoration:none; transition:all 0.15s; white-space:nowrap; }
  .metricool-btn:hover { background:rgba(26,170,150,0.18); border-color:var(--teal-mid); }

  /* COPY ROW */
  .copy-row { display:flex; gap:8px; align-items:flex-start; }
  .copy-row textarea { flex:1; }
  .copy-btn { font-family:'DM Mono',monospace; font-size:0.63rem; padding:7px 11px; border-radius:5px; border:1px solid rgba(201,168,76,0.28); background:transparent; color:var(--gold); cursor:pointer; white-space:nowrap; transition:all 0.13s; margin-top:2px; letter-spacing:0.07em; }
  .copy-btn:hover { background:rgba(201,168,76,0.1); border-color:var(--gold); }
  .copy-btn.copied { background:rgba(26,170,150,0.18); color:var(--teal-mid); border-color:var(--teal-mid); }

  /* PLATFORMS */
  .platforms-row { display:flex; gap:7px; flex-wrap:wrap; }
  .platform-chip { display:flex; align-items:center; gap:5px; padding:5px 11px; border-radius:20px; border:1px solid rgba(255,255,255,0.09); cursor:pointer; font-family:'DM Mono',monospace; font-size:0.66rem; letter-spacing:0.05em; transition:all 0.13s; color:var(--muted); background:rgba(0,0,0,0.18); }
  .platform-chip.active-insta { background:rgba(225,48,108,0.11); color:#e1306c; border-color:rgba(225,48,108,0.38); }
  .platform-chip.active-linkedin { background:rgba(0,119,181,0.11); color:#4ab3e8; border-color:rgba(0,119,181,0.38); }
  .platform-chip.active-google { background:rgba(66,133,244,0.11); color:#7baeff; border-color:rgba(66,133,244,0.38); }

  /* STATUS */
  .status-row { display:flex; gap:7px; flex-wrap:wrap; }
  .status-chip { font-family:'DM Mono',monospace; font-size:0.62rem; letter-spacing:0.1em; padding:4px 11px; border-radius:20px; border:1px solid; cursor:pointer; transition:all 0.13s; text-transform:uppercase; }
  .status-chip.rascunho { border-color:rgba(122,110,96,0.45); color:var(--muted); }
  .status-chip.rascunho.active { background:rgba(122,110,96,0.18); color:var(--cream-dim); }
  .status-chip.pronto { border-color:rgba(201,168,76,0.45); color:var(--gold); }
  .status-chip.pronto.active { background:rgba(201,168,76,0.14); }
  .status-chip.publicado { border-color:rgba(26,170,150,0.45); color:var(--teal-mid); }
  .status-chip.publicado.active { background:rgba(26,170,150,0.14); }

  /* MESSAGES */
  .messages-list { display:flex; flex-direction:column; gap:8px; }
  .message-item { display:flex; gap:8px; align-items:flex-start; }
  .message-item textarea { min-height:56px; }
  .msg-select { width:118px; min-width:118px; font-size:0.8rem; padding:7px; }

  /* DOCS */
  .docs-list { display:flex; flex-direction:column; gap:7px; }
  .doc-item { display:flex; gap:8px; align-items:center; background:rgba(0,0,0,0.18); border:1px solid rgba(201,168,76,0.1); border-radius:6px; padding:8px 11px; }
  .doc-icon { font-size:1rem; flex-shrink:0; }
  .doc-name { flex:1; font-size:0.88rem; color:var(--cream-dim); }
  .doc-link { font-size:0.72rem; color:var(--teal-mid); font-family:'DM Mono',monospace; cursor:pointer; flex-shrink:0; }
  .doc-link:hover { text-decoration:underline; }
  .doc-add-row { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .doc-add-row input { flex:1; min-width:120px; }

  /* ADD PUB BAR */
  .add-pub-bar { display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }

  /* ═══════════════════════════════════════
     CALENDAR VIEW
  ═══════════════════════════════════════ */
  .cal-wrap { padding:0; }
  .cal-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
  .cal-month-title { font-family:'Dancing Script',cursive; font-size:1.8rem; color:var(--gold); }
  .cal-nav-btns { display:flex; gap:6px; }
  .cal-nav-btn { background:rgba(0,0,0,0.2); border:1px solid rgba(201,168,76,0.25); color:var(--gold); padding:6px 14px; border-radius:4px; cursor:pointer; font-family:'DM Mono',monospace; font-size:0.72rem; transition:all 0.15s; }
  .cal-nav-btn:hover { background:rgba(201,168,76,0.1); }

  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
  .cal-dow { font-family:'DM Mono',monospace; font-size:0.62rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--gold); text-align:center; padding:6px 0 10px; opacity:0.7; }
  .cal-cell { min-height:110px; border:1px solid rgba(201,168,76,0.08); border-radius:6px; padding:8px 6px 6px; background:rgba(0,0,0,0.12); cursor:pointer; transition:background 0.13s; position:relative; vertical-align:top; }
  .cal-cell:hover { background:rgba(201,168,76,0.06); }
  .cal-cell.today { border-color:rgba(201,168,76,0.4); }
  .cal-cell.has-day { background:rgba(26,170,150,0.04); }
  .cal-cell.other-month { opacity:0.3; pointer-events:none; }
  .cal-day-num { font-family:'DM Mono',monospace; font-size:0.68rem; color:var(--muted); margin-bottom:6px; display:flex; align-items:center; justify-content:space-between; }
  .cal-day-num .today-dot { width:5px; height:5px; background:var(--gold); border-radius:50%; }
  .cal-pub-pill { font-family:'DM Mono',monospace; font-size:0.6rem; border-radius:3px; padding:2px 5px; margin-bottom:2px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:opacity 0.12s; display:flex; align-items:center; gap:4px; }
  .cal-pub-pill:hover { opacity:0.75; }
  .pill-reel { background:rgba(225,48,108,0.18); color:#e1306c; }
  .pill-post { background:rgba(26,170,150,0.18); color:var(--teal-mid); }
  .pill-story { background:rgba(201,168,76,0.18); color:var(--gold); }
  .pill-rascunho { opacity:0.6; }
  .pill-pronto { }
  .pill-publicado { text-decoration:line-through; opacity:0.5; }
  .cal-add-btn { position:absolute; bottom:5px; right:5px; background:rgba(201,168,76,0.12); border:none; color:var(--gold); font-size:0.9rem; width:20px; height:20px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:center; line-height:1; transition:background 0.13s; }
  .cal-add-btn:hover { background:rgba(201,168,76,0.25); }

  /* TIMELINE (day detail from calendar) */
  .timeline-header { display:flex; align-items:center; gap:14px; margin-bottom:18px; }
  .timeline-back { background:transparent; border:1px solid rgba(201,168,76,0.3); color:var(--gold); padding:5px 12px; border-radius:4px; cursor:pointer; font-family:'DM Mono',monospace; font-size:0.68rem; transition:all 0.13s; }
  .timeline-back:hover { background:rgba(201,168,76,0.08); }
  .timeline-title { font-family:'Dancing Script',cursive; font-size:1.7rem; color:var(--gold); }

  .timeline { display:flex; flex-direction:column; gap:0; position:relative; padding-left:70px; }
  .timeline::before { content:''; position:absolute; left:54px; top:0; bottom:0; width:1px; background:rgba(201,168,76,0.15); }
  .tl-item { display:flex; align-items:flex-start; gap:14px; position:relative; padding:0 0 18px; }
  .tl-time { position:absolute; left:-70px; width:52px; text-align:right; font-family:'DM Mono',monospace; font-size:0.68rem; color:var(--gold); padding-top:12px; }
  .tl-dot { position:absolute; left:-19px; width:10px; height:10px; border-radius:50%; border:2px solid var(--teal-dark); margin-top:14px; flex-shrink:0; }
  .tl-dot.reel { background:#e1306c; }
  .tl-dot.post { background:var(--teal-mid); }
  .tl-dot.story { background:var(--gold); }
  .tl-card { flex:1; background:rgba(255,255,255,0.035); border:1px solid rgba(201,168,76,0.13); border-radius:8px; padding:12px 14px; cursor:pointer; transition:border-color 0.15s; }
  .tl-card:hover { border-color:rgba(201,168,76,0.3); }
  .tl-card-top { display:flex; align-items:center; gap:8px; margin-bottom:6px; flex-wrap:wrap; }
  .tl-title { font-weight:600; font-size:0.95rem; color:var(--cream); flex:1; }
  .tl-caption-preview { font-size:0.82rem; color:var(--muted); font-style:italic; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .tl-platforms { display:flex; gap:5px; }
  .tl-plat { font-size:0.7rem; }
  .tl-no-time { font-family:'DM Mono',monospace; font-size:0.68rem; color:var(--muted); padding:10px 0; font-style:italic; }

  /* MODAL */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.72); z-index:200; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
  .modal-overlay.hidden { display:none; }
  .modal { background:#0e3f3c; border:1px solid rgba(201,168,76,0.28); border-radius:12px; padding:26px 28px; width:min(400px,94vw); display:flex; flex-direction:column; gap:14px; }
  .modal h3 { font-family:'Dancing Script',cursive; font-size:1.45rem; color:var(--gold); }
  .modal label { font-size:0.78rem; color:var(--cream-dim); font-family:'DM Mono',monospace; letter-spacing:0.08em; display:block; margin-bottom:4px; }
  .modal-actions { display:flex; gap:9px; justify-content:flex-end; margin-top:6px; }

  /* TOAST */
  .toast { position:fixed; bottom:24px; right:24px; background:var(--teal-dark); border:1px solid var(--teal-mid); color:var(--teal-mid); font-family:'DM Mono',monospace; font-size:0.75rem; padding:9px 18px; border-radius:6px; z-index:300; opacity:0; transform:translateY(8px); transition:all 0.22s; pointer-events:none; letter-spacing:0.06em; }
  .toast.show { opacity:1; transform:translateY(0); }

  ::-webkit-scrollbar { width:4px; }
  ::-webkit-scrollbar-thumb { background:rgba(201,168,76,0.22); border-radius:2px; }

  @media(max-width:680px) {
    .layout { grid-template-columns:1fr; }
    .sidebar { position:static; max-height:none; border-right:none; border-bottom:1px solid rgba(201,168,76,0.12); }
    .content { padding:18px 14px; }
    header { padding:14px 14px; }
    .cal-cell { min-height:70px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Patrícia Leal <span>Content Hub · Bússola Imobiliária</span></div>
  <div class="header-actions">
    <div class="nav-tabs">
      <button class="nav-tab active" id="tab-dias" onclick="switchTab('dias')">Dias</button>
      <button class="nav-tab" id="tab-calendario" onclick="switchTab('calendario')">Calendário</button>
    </div>
    <button class="btn btn-outline" onclick="exportData()">⬇ Exportar</button>
    <button class="btn btn-outline" onclick="importData()">⬆ Importar</button>
    <button class="btn btn-gold" onclick="openNewDayModal()">+ Novo dia</button>
  </div>
</header>

<div class="layout" id="layout-dias">
  <aside class="sidebar">
    <div class="sidebar-title">Dias</div>
    <div id="day-list"></div>
    <div style="margin:12px 16px 0;">
      <button class="btn btn-outline" style="width:100%;font-size:0.78rem;" onclick="openNewDayModal()">+ Adicionar dia</button>
    </div>
  </aside>
  <main class="content" id="main-content">
    <div class="empty-state"><div class="empty-icon">📅</div><p>Seleciona um dia ou cria um novo.</p></div>
  </main>
</div>

<div id="layout-calendario" style="display:none; padding:26px 30px;">
  <div class="cal-wrap">
    <div class="cal-nav">
      <div class="cal-month-title" id="cal-month-title">—</div>
      <div class="cal-nav-btns">
        <button class="cal-nav-btn" onclick="calNav(-1)">← Anterior</button>
        <button class="cal-nav-btn" onclick="calNav(0)">Hoje</button>
        <button class="cal-nav-btn" onclick="calNav(1)">Próximo →</button>
      </div>
    </div>
    <div id="cal-grid-wrap"></div>
  </div>
  <!-- Timeline overlay -->
  <div id="cal-timeline" style="display:none;">
    <div class="timeline-header">
      <button class="timeline-back" onclick="closeTimeline()">← Voltar ao calendário</button>
      <div class="timeline-title" id="tl-date-title">—</div>
    </div>
    <div id="tl-add-bar" class="add-pub-bar"></div>
    <div id="timeline-wrap"></div>
  </div>
</div>

<!-- MODAL NOVO DIA -->
<div class="modal-overlay hidden" id="modal-day">
  <div class="modal">
    <h3>Novo dia de conteúdo</h3>
    <div><label>Data</label><input type="date" id="new-day-date"></div>
    <div><label>Nota (opcional)</label><input type="text" id="new-day-note" placeholder="ex: Semana de lançamento…"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('modal-day')">Cancelar</button>
      <button class="btn btn-gold" onclick="addDay()">Criar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="import-file-input" accept=".json" style="display:none" onchange="handleImport(event)">

<script>
// ─── STATE ────────────────────────────────────────────────────────────────────
let state = { days: [] };
let activeDayId = null;
let currentTab = 'dias';
let calYear, calMonth; // calendar month
let calTimelineDate = null; // 'YYYY-MM-DD'

const STORAGE_KEY = 'patricia_hub_v2';
const MONTHS_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DAYS_PT = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MONTHS_PT_SHORT = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){} }
function load() { try { const d=localStorage.getItem(STORAGE_KEY); if(d) state=JSON.parse(d); } catch(e){} }
function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

// ─── INIT ─────────────────────────────────────────────────────────────────────
load();
const now = new Date();
calYear = now.getFullYear(); calMonth = now.getMonth();
renderSidebar();
if (state.days.length) selectDay(state.days.sort((a,b)=>a.date.localeCompare(b.date))[0].id);

// ─── TABS ─────────────────────────────────────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-dias').classList.toggle('active', tab==='dias');
  document.getElementById('tab-calendario').classList.toggle('active', tab==='calendario');
  document.getElementById('layout-dias').style.display = tab==='dias' ? 'grid' : 'none';
  document.getElementById('layout-calendario').style.display = tab==='calendario' ? 'block' : 'none';
  if (tab==='calendario') { closeTimeline(); renderCalendar(); }
}

// ─── SIDEBAR ──────────────────────────────────────────────────────────────────
function renderSidebar() {
  const el = document.getElementById('day-list');
  if (!state.days.length) { el.innerHTML='<div style="padding:10px 16px;font-size:0.78rem;color:var(--muted);font-style:italic;">Sem dias ainda.</div>'; return; }
  const sorted = [...state.days].sort((a,b)=>a.date.localeCompare(b.date));
  el.innerHTML = sorted.map(d => {
    const n=d.publications.length, pub=d.publications.filter(p=>p.status==='publicado').length;
    return `<div class="day-item ${activeDayId===d.id?'active':''}" onclick="selectDay('${d.id}')">
      <span class="day-label">${fmtDate(d.date)}</span>
      <span class="day-date">${d.note||''}</span>
      <span class="day-count ${n>0?'has':''}">${n} pub${n!==1?'s':''} · ${pub} publicadas</span>
    </div>`;
  }).join('');
}

function fmtDate(iso) {
  if (!iso) return '—';
  const [y,m,d] = iso.split('-');
  const dt = new Date(+y,+m-1,+d);
  return `${DAYS_PT[dt.getDay()]} ${+d} ${MONTHS_PT_SHORT[+m-1]}`;
}

function selectDay(id) {
  activeDayId = id; renderSidebar(); renderDayView();
}

// ─── DAY VIEW ─────────────────────────────────────────────────────────────────
function renderDayView() {
  const day = state.days.find(d=>d.id===activeDayId); if(!day) return;
  const main = document.getElementById('main-content');
  const sorted = [...day.publications].sort((a,b)=>(a.scheduledTime||'99:99').localeCompare(b.scheduledTime||'99:99'));
  main.innerHTML = `
    <div class="day-header">
      <div>
        <div class="day-title">${fmtDate(day.date)}</div>
        <div class="day-subtitle">${day.date}${day.note?' · '+day.note:''}</div>
      </div>
      <button class="btn btn-outline" style="color:var(--red);border-color:rgba(192,57,43,0.38);font-size:0.78rem;" onclick="deleteDay('${day.id}')">Apagar dia</button>
    </div>
    <div class="add-pub-bar">
      <button class="btn btn-gold" onclick="addPublication('${day.id}','reel')">+ Reel</button>
      <button class="btn btn-outline" onclick="addPublication('${day.id}','post')">+ Post</button>
      <button class="btn btn-outline" onclick="addPublication('${day.id}','story')">+ Story</button>
    </div>
    <div class="cards-grid">${sorted.map(p=>renderPubCard(p,day.date)).join('')}</div>
  `;
}

// ─── PUB CARD ─────────────────────────────────────────────────────────────────
function renderPubCard(p, dayDate) {
  const platHtml = ['instagram','linkedin','google'].map(pl => {
    const cls = p.platforms.includes(pl) ? `active-${pl==='instagram'?'insta':pl}` : '';
    const icon = pl==='instagram'?'📷':pl==='linkedin'?'💼':'🔍';
    return `<span class="platform-chip ${cls}" onclick="togglePlatform('${p.id}','${pl}')">${icon} ${pl.charAt(0).toUpperCase()+pl.slice(1)}</span>`;
  }).join('');

  const statusHtml = ['rascunho','pronto','publicado'].map(s=>
    `<span class="status-chip ${s} ${p.status===s?'active':''}" onclick="setStatus('${p.id}','${s}')">${s}</span>`
  ).join('');

  const messagesHtml = (p.messages||[]).map((m,i)=>`
    <div class="message-item">
      <select class="msg-select" onchange="updateMessage('${p.id}',${i},'type',this.value)">
        <option value="comentario" ${m.type==='comentario'?'selected':''}>Comentário</option>
        <option value="dm" ${m.type==='dm'?'selected':''}>DM</option>
        <option value="email" ${m.type==='email'?'selected':''}>E-mail</option>
        <option value="whatsapp" ${m.type==='whatsapp'?'selected':''}>WhatsApp</option>
      </select>
      <div class="copy-row" style="flex:1">
        <textarea rows="2" placeholder="Mensagem quando interagem…" onblur="updateMessage('${p.id}',${i},'text',this.value)">${escH(m.text||'')}</textarea>
        <button class="copy-btn" onclick="copyText(this,${JSON.stringify(m.text||'')})">Copiar</button>
      </div>
      <button class="icon-btn danger" onclick="removeMessage('${p.id}',${i})">✕</button>
    </div>`).join('');

  const docsHtml = (p.docs||[]).map((d,i)=>`
    <div class="doc-item">
      <span class="doc-icon">📄</span>
      <span class="doc-name">${escH(d.name)}</span>
      ${d.url?`<span class="doc-link" onclick="window.open('${d.url}','_blank')">Abrir ↗</span>`:''}
      <button class="icon-btn danger" onclick="removeDoc('${p.id}',${i})">✕</button>
    </div>`).join('');

  // Schedule badge + Metricool link
  const schedDate = dayDate || '';
  const schedTime = p.scheduledTime || '';
  const schedLabel = schedTime ? `${schedDate} às ${schedTime}` : '';
  const metriLink = `https://app.metricool.com/`;

  const collapsed = p.collapsed ? 'collapsed' : '';

  return `<div class="pub-card" id="card-${p.id}">
    <div class="pub-card-header" onclick="toggleCollapse('${p.id}')">
      <div class="pub-card-header-left">
        <span class="type-badge type-${p.type}">${p.type}</span>
        <input class="pub-title-input" type="text" value="${escH(p.title||'')}" placeholder="Título…"
          onclick="event.stopPropagation()" onblur="updatePubField('${p.id}','title',this.value)">
        ${schedTime ? `<span class="sched-badge">🕐 ${schedTime}</span>` : ''}
      </div>
      <div class="card-actions" onclick="event.stopPropagation()">
        <span class="status-chip ${p.status} active" style="font-size:0.58rem;padding:2px 8px;">${p.status}</span>
        <button class="icon-btn" onclick="toggleCollapse('${p.id}')">${p.collapsed?'▼':'▲'}</button>
        <button class="icon-btn danger" onclick="deletePublication('${p.id}')">🗑</button>
      </div>
    </div>
    <div class="pub-card-body ${collapsed}" id="body-${p.id}">

      <!-- AGENDAMENTO -->
      <div>
        <div class="section-label">Hora de publicação agendada</div>
        <div class="schedule-row">
          <input type="time" class="schedule-time" value="${escH(schedTime)}"
            onchange="updatePubField('${p.id}','scheduledTime',this.value)">
          ${schedLabel ? `<span class="sched-badge">📅 ${schedLabel}</span>` : ''}
          <a class="metricool-btn" href="${metriLink}" target="_blank">
            <span>▶</span> Abrir Metricool
          </a>
        </div>
      </div>

      <!-- PLATAFORMAS -->
      <div>
        <div class="section-label">Plataformas</div>
        <div class="platforms-row">${platHtml}</div>
      </div>

      <!-- STATUS -->
      <div>
        <div class="section-label">Estado</div>
        <div class="status-row">${statusHtml}</div>
      </div>

      <!-- LEGENDA -->
      <div>
        <div class="section-label">Legenda / Copy</div>
        <div class="copy-row">
          <textarea rows="5" placeholder="Legenda completa para esta publicação…"
            onblur="updatePubField('${p.id}','caption',this.value)">${escH(p.caption||'')}</textarea>
          <button class="copy-btn" onclick="copyFieldText(this,'cap-${p.id}')">Copiar</button>
        </div>
        <textarea id="cap-${p.id}" style="display:none">${escH(p.caption||'')}</textarea>
      </div>

      <!-- NOTAS -->
      <div>
        <div class="section-label">Notas internas</div>
        <textarea rows="2" placeholder="Tema, ângulo, ideia do visual…"
          onblur="updatePubField('${p.id}','notes',this.value)">${escH(p.notes||'')}</textarea>
      </div>

      <!-- HASHTAGS -->
      <div>
        <div class="section-label">Hashtags</div>
        <div class="copy-row">
          <textarea rows="2" placeholder="#imobiliário #benavente #ribatejo…"
            onblur="updatePubField('${p.id}','hashtags',this.value)">${escH(p.hashtags||'')}</textarea>
          <button class="copy-btn" onclick="copyFieldText(this,'ht-${p.id}')">Copiar</button>
        </div>
        <textarea id="ht-${p.id}" style="display:none">${escH(p.hashtags||'')}</textarea>
      </div>

      <!-- MENSAGENS -->
      <div>
        <div class="section-label">Mensagens de resposta quando interagem</div>
        <div class="messages-list" id="msgs-${p.id}">${messagesHtml}</div>
        <button class="btn btn-outline" style="margin-top:7px;font-size:0.76rem;" onclick="addMessage('${p.id}')">+ Adicionar mensagem</button>
      </div>

      <!-- DOCUMENTOS -->
      <div>
        <div class="section-label">Documentos a oferecer</div>
        <div class="docs-list" id="docs-${p.id}">${docsHtml}</div>
        <div class="doc-add-row">
          <input type="text" id="doc-name-${p.id}" placeholder="Nome do documento…">
          <input type="text" id="doc-url-${p.id}" placeholder="Link (Netlify, Drive…)">
          <button class="copy-btn" onclick="addDoc('${p.id}')">+ Adicionar</button>
        </div>
      </div>

    </div>
  </div>`;
}

// ─── CALENDAR ─────────────────────────────────────────────────────────────────
function renderCalendar() {
  document.getElementById('cal-timeline').style.display = 'none';
  document.querySelector('.cal-wrap').style.display = 'block';
  document.getElementById('cal-month-title').textContent = `${MONTHS_PT[calMonth]} ${calYear}`;

  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const daysInPrev = new Date(calYear, calMonth, 0).getDate();
  const todayStr = new Date().toISOString().slice(0,10);

  // Build indexed map date->publications
  const pubMap = {};
  for (const d of state.days) {
    if (!pubMap[d.date]) pubMap[d.date] = [];
    pubMap[d.date].push(...d.publications.map(p=>({...p, dayDate:d.date})));
  }

  let html = '<div class="cal-grid">';
  // Day-of-week headers
  ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].forEach(d => { html += `<div class="cal-dow">${d}</div>`; });

  // Prev month filler
  for (let i=0; i<firstDay; i++) {
    const day = daysInPrev - firstDay + 1 + i;
    html += `<div class="cal-cell other-month"><div class="cal-day-num">${day}</div></div>`;
  }

  // Current month cells
  for (let d=1; d<=daysInMonth; d++) {
    const iso = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = iso === todayStr;
    const pubs = pubMap[iso] || [];
    const hasDay = state.days.find(x=>x.date===iso);
    const pillsHtml = pubs.slice(0,4).map(p => {
      const timeLabel = p.scheduledTime ? p.scheduledTime+' ' : '';
      return `<div class="cal-pub-pill pill-${p.type} pill-${p.status}" onclick="event.stopPropagation(); openTimeline('${iso}')" title="${escH(p.title||p.type)}">${timeLabel}${escH(p.title||p.type)}</div>`;
    }).join('');
    const moreHtml = pubs.length > 4 ? `<div style="font-family:'DM Mono',monospace;font-size:0.58rem;color:var(--muted);padding:1px 4px;">+${pubs.length-4} mais</div>` : '';
    html += `<div class="cal-cell ${isToday?'today':''} ${hasDay?'has-day':''}" onclick="openTimeline('${iso}')">
      <div class="cal-day-num">${d}${isToday?'<span class="today-dot"></span>':''}</div>
      ${pillsHtml}${moreHtml}
      <button class="cal-add-btn" onclick="event.stopPropagation(); calAddPub('${iso}')" title="Adicionar publicação">+</button>
    </div>`;
  }

  // Next month filler
  const total = firstDay + daysInMonth;
  const remaining = total % 7 === 0 ? 0 : 7 - (total % 7);
  for (let i=1; i<=remaining; i++) {
    html += `<div class="cal-cell other-month"><div class="cal-day-num">${i}</div></div>`;
  }
  html += '</div>';
  document.getElementById('cal-grid-wrap').innerHTML = html;
}

function calNav(dir) {
  if (dir === 0) { const n=new Date(); calYear=n.getFullYear(); calMonth=n.getMonth(); }
  else { calMonth += dir; if(calMonth<0){calMonth=11;calYear--;} if(calMonth>11){calMonth=0;calYear++;} }
  renderCalendar();
}

function openTimeline(iso) {
  calTimelineDate = iso;
  document.querySelector('.cal-wrap').style.display = 'none';
  const tl = document.getElementById('cal-timeline');
  tl.style.display = 'block';
  document.getElementById('tl-date-title').textContent = fmtDate(iso);

  // Add bar
  let day = state.days.find(d=>d.date===iso);
  const dayId = day ? day.id : null;
  document.getElementById('tl-add-bar').innerHTML = dayId
    ? `<button class="btn btn-gold" onclick="addPubFromTL('${dayId}','reel')">+ Reel</button>
       <button class="btn btn-outline" onclick="addPubFromTL('${dayId}','post')">+ Post</button>
       <button class="btn btn-outline" onclick="addPubFromTL('${dayId}','story')">+ Story</button>`
    : `<button class="btn btn-gold" onclick="calCreateDayAndAdd('${iso}','reel')">+ Criar dia e adicionar Reel</button>
       <button class="btn btn-outline" onclick="calCreateDayAndAdd('${iso}','post')">+ Post</button>`;

  renderTimeline(iso);
}

function renderTimeline(iso) {
  const wrap = document.getElementById('timeline-wrap');
  const day = state.days.find(d=>d.date===iso);
  if (!day || !day.publications.length) {
    wrap.innerHTML = `<div class="tl-no-time">Sem publicações para este dia. Usa os botões acima para adicionar.</div>`;
    return;
  }
  const sorted = [...day.publications].sort((a,b)=>(a.scheduledTime||'99:99').localeCompare(b.scheduledTime||'99:99'));
  const platIcon = p => p.platforms.map(pl=>pl==='instagram'?'📷':pl==='linkedin'?'💼':'🔍').join('');

  wrap.innerHTML = `<div class="timeline">${sorted.map(p=>`
    <div class="tl-item">
      <div class="tl-time">${p.scheduledTime||'—'}</div>
      <div class="tl-dot ${p.type}"></div>
      <div class="tl-card" onclick="goToPub('${day.id}','${p.id}')">
        <div class="tl-card-top">
          <span class="type-badge type-${p.type}">${p.type}</span>
          <span class="tl-title">${escH(p.title||'Sem título')}</span>
          <span class="status-chip ${p.status} active" style="font-size:0.58rem;padding:2px 7px;">${p.status}</span>
          <span class="tl-platforms">${platIcon(p)}</span>
        </div>
        ${p.caption ? `<div class="tl-caption-preview">${escH(p.caption)}</div>` : ''}
      </div>
    </div>`).join('')}
  </div>`;
}

function closeTimeline() {
  calTimelineDate = null;
  document.getElementById('cal-timeline').style.display = 'none';
  document.querySelector('.cal-wrap').style.display = 'block';
  renderCalendar();
}

function calAddPub(iso) {
  let day = state.days.find(d=>d.date===iso);
  if (!day) { day = { id:uid(), date:iso, note:'', publications:[] }; state.days.push(day); save(); renderSidebar(); }
  openTimeline(iso);
}

function calCreateDayAndAdd(iso, type) {
  let day = state.days.find(d=>d.date===iso);
  if (!day) { day = { id:uid(), date:iso, note:'', publications:[] }; state.days.push(day); save(); renderSidebar(); }
  addPubFromTL(day.id, type);
}

function addPubFromTL(dayId, type) {
  const day = state.days.find(d=>d.id===dayId); if(!day) return;
  const pub = { id:uid(), type, title:'', caption:'', notes:'', hashtags:'', platforms:['instagram'], status:'rascunho', messages:[], docs:[], collapsed:false, scheduledTime:'' };
  day.publications.push(pub); save(); renderSidebar();
  renderTimeline(day.date);
  document.getElementById('tl-add-bar').innerHTML = `<button class="btn btn-gold" onclick="addPubFromTL('${dayId}','reel')">+ Reel</button>
    <button class="btn btn-outline" onclick="addPubFromTL('${dayId}','post')">+ Post</button>
    <button class="btn btn-outline" onclick="addPubFromTL('${dayId}','story')">+ Story</button>`;
  showToast('Publicação criada — vai ao separador Dias para editar.');
}

function goToPub(dayId, pubId) {
  switchTab('dias');
  activeDayId = dayId; renderSidebar(); renderDayView();
  setTimeout(()=>{ const el=document.getElementById('card-'+pubId); if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.style.boxShadow='0 0 0 2px var(--gold)'; setTimeout(()=>el.style.boxShadow='',1500); }},200);
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function escH(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function getPub(pid){ for(const d of state.days){ const p=d.publications.find(x=>x.id===pid); if(p) return {day:d,pub:p}; } return null; }

function updatePubField(pid,field,val){
  const r=getPub(pid); if(!r) return;
  r.pub[field]=val; save();
  // sync hidden textareas
  const capEl=document.getElementById('cap-'+pid); if(capEl&&field==='caption') capEl.value=val;
  const htEl=document.getElementById('ht-'+pid); if(htEl&&field==='hashtags') htEl.value=val;
  if(field==='scheduledTime'){ renderSidebar(); if(calTimelineDate) renderTimeline(calTimelineDate); }
  else renderSidebar();
}

function copyFieldText(btn, hiddenId){
  const el=document.getElementById(hiddenId);
  const val = el ? el.value : '';
  // Also try adjacent visible textarea
  const row=btn.closest('.copy-row'); const ta=row?row.querySelector('textarea'):null;
  const text = ta ? ta.value : val;
  copyText(btn, text);
}

function copyText(btn,text){
  navigator.clipboard.writeText(text).then(()=>{
    const orig=btn.textContent; btn.textContent='✓ Copiado'; btn.classList.add('copied');
    setTimeout(()=>{ btn.textContent=orig; btn.classList.remove('copied'); },1800);
  });
}

function toggleCollapse(pid){
  const r=getPub(pid); if(!r) return;
  r.pub.collapsed=!r.pub.collapsed; save();
  const body=document.getElementById('body-'+pid);
  const btn=document.querySelector(`#card-${pid} .icon-btn:not(.danger)`);
  if(body) body.classList.toggle('collapsed',r.pub.collapsed);
  if(btn) btn.textContent=r.pub.collapsed?'▼':'▲';
}

function togglePlatform(pid,pl){
  const r=getPub(pid); if(!r) return;
  const idx=r.pub.platforms.indexOf(pl);
  if(idx===-1) r.pub.platforms.push(pl); else r.pub.platforms.splice(idx,1);
  save();
  document.querySelectorAll(`#card-${pid} .platform-chip`).forEach(ch=>{
    const p2=ch.textContent.trim().toLowerCase();
    const key=p2.includes('insta')?'instagram':p2.includes('linked')?'linkedin':'google';
    ch.className='platform-chip '+(r.pub.platforms.includes(key)?`active-${key==='instagram'?'insta':key}`:'');
  });
}

function setStatus(pid,status){
  const r=getPub(pid); if(!r) return;
  r.pub.status=status; save();
  document.querySelectorAll(`#card-${pid} .status-row .status-chip`).forEach(ch=>ch.classList.toggle('active',ch.classList.contains(status)));
  const badge=document.querySelector(`#card-${pid} .pub-card-header .status-chip`);
  if(badge){ badge.className=`status-chip ${status} active`; badge.textContent=status; }
  renderSidebar();
}

function addMessage(pid){
  const r=getPub(pid); if(!r) return;
  r.pub.messages=r.pub.messages||[]; r.pub.messages.push({type:'comentario',text:''}); save();
  const i=r.pub.messages.length-1;
  const div=document.createElement('div'); div.className='message-item';
  div.innerHTML=`<select class="msg-select" onchange="updateMessage('${pid}',${i},'type',this.value)">
    <option value="comentario">Comentário</option><option value="dm">DM</option>
    <option value="email">E-mail</option><option value="whatsapp">WhatsApp</option></select>
    <div class="copy-row" style="flex:1">
      <textarea rows="2" placeholder="Mensagem quando interagem…" onblur="updateMessage('${pid}',${i},'text',this.value)"></textarea>
      <button class="copy-btn" onclick="copyText(this,this.previousElementSibling.value)">Copiar</button>
    </div>
    <button class="icon-btn danger" onclick="removeMessage('${pid}',${i})">✕</button>`;
  document.getElementById('msgs-'+pid).appendChild(div);
}

function updateMessage(pid,i,field,val){ const r=getPub(pid); if(!r||!r.pub.messages[i]) return; r.pub.messages[i][field]=val; save(); }
function removeMessage(pid,i){ const r=getPub(pid); if(!r) return; r.pub.messages.splice(i,1); save(); renderDayView(); }

function addDoc(pid){
  const nEl=document.getElementById('doc-name-'+pid), uEl=document.getElementById('doc-url-'+pid);
  const name=nEl.value.trim(); if(!name){ showToast('Indica o nome do documento.'); return; }
  const r=getPub(pid); if(!r) return;
  r.pub.docs=r.pub.docs||[]; r.pub.docs.push({name,url:uEl.value.trim()}); save();
  nEl.value=''; uEl.value=''; renderDayView();
}
function removeDoc(pid,i){ const r=getPub(pid); if(!r) return; r.pub.docs.splice(i,1); save(); renderDayView(); }

// ─── CRUD ────────────────────────────────────────────────────────────────────
function openNewDayModal(){
  document.getElementById('new-day-date').value=new Date().toISOString().slice(0,10);
  document.getElementById('new-day-note').value='';
  document.getElementById('modal-day').classList.remove('hidden');
}
function closeModal(id){ document.getElementById(id).classList.add('hidden'); }

function addDay(){
  const date=document.getElementById('new-day-date').value;
  const note=document.getElementById('new-day-note').value.trim();
  if(!date){ showToast('Seleciona uma data.'); return; }
  if(state.days.find(d=>d.date===date)){ showToast('Já existe um dia para esta data.'); return; }
  const nd={id:uid(),date,note,publications:[]}; state.days.push(nd); save();
  closeModal('modal-day'); renderSidebar();
  if(currentTab==='calendario') renderCalendar();
  else selectDay(nd.id);
}

function deleteDay(id){
  if(!confirm('Apagar este dia e todas as publicações?')) return;
  state.days=state.days.filter(d=>d.id!==id); save();
  activeDayId=state.days.length?[...state.days].sort((a,b)=>a.date.localeCompare(b.date))[0].id:null;
  renderSidebar();
  if(activeDayId) renderDayView();
  else document.getElementById('main-content').innerHTML='<div class="empty-state"><div class="empty-icon">📅</div><p>Seleciona um dia ou cria um novo.</p></div>';
}

function addPublication(dayId,type){
  const day=state.days.find(d=>d.id===dayId); if(!day) return;
  const pub={id:uid(),type,title:'',caption:'',notes:'',hashtags:'',platforms:['instagram'],status:'rascunho',messages:[],docs:[],collapsed:false,scheduledTime:''};
  day.publications.push(pub); save(); renderDayView(); renderSidebar();
}

function deletePublication(pid){
  if(!confirm('Apagar esta publicação?')) return;
  const day=state.days.find(d=>d.id===activeDayId); if(!day) return;
  day.publications=day.publications.filter(p=>p.id!==pid);
  save(); renderDayView(); renderSidebar();
}

// ─── EXPORT/IMPORT ───────────────────────────────────────────────────────────
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='content-hub-backup.json'; a.click();
  URL.revokeObjectURL(url); showToast('Backup exportado ✓');
}
function importData(){ document.getElementById('import-file-input').click(); }
function handleImport(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const imp=JSON.parse(ev.target.result);
      if(!imp.days) throw new Error();
      if(!confirm('Substituir dados actuais pelo backup?')) return;
      state=imp; save(); renderSidebar();
      activeDayId=state.days.length?[...state.days].sort((a,b)=>a.date.localeCompare(b.date))[0].id:null;
      if(activeDayId) renderDayView();
      showToast('Importado com sucesso ✓');
    } catch { showToast('Ficheiro inválido.'); }
  };
  reader.readAsText(file); e.target.value='';
}

// ─── TOAST ───────────────────────────────────────────────────────────────────
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }
</script>
